name: RyGT Diagnostics CI package
run-name: GT7 experimental discovery build
on:
  push:
    branches: [feat/shader-preparation-nvidia-4070]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gt7-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    if: github.repository == 'gperea602/RyGT' && github.ref == 'refs/heads/feat/shader-preparation-nvidia-4070'
    runs-on: ubuntu-24.04
    outputs:
      renderer: ${{ steps.pin.outputs.renderer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify experimental renderer pin
        id: pin
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          pin = json.loads(Path("renderer/source.json").read_text())
          assert pin["repository"] == "https://github.com/gperea602/shadGT.git"
          assert pin["branch"] == "feat/shader-preparation-nvidia-4070"
          assert re.fullmatch("[0-9a-f]{40}", pin["commit"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("renderer=" + pin["commit"], file=out)
          PY
      - name: Run discovery and runtime Python tests
        run: python3 -m unittest discover -s ci/tests -p 'test_*.py' -v
  windows:
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      RENDERER_SHA: ${{ needs.tests.outputs.renderer }}
      RYGT_CI_ROOT: C:/rygt-ci/${{ github.run_id }}-diagnostics
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.401'
      - name: Fetch exact fork runtime
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid source SHA' }
          New-Item -ItemType Directory -Force $env:RYGT_CI_ROOT | Out-Null
          Set-Location $env:RYGT_CI_ROOT
          git init
          git config core.longpaths true
          git remote add origin https://github.com/gperea602/RyGT.git
          git fetch --depth=1 origin $env:SOURCE_SHA
          if ($LASTEXITCODE) { throw 'Fork fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -or (git rev-parse HEAD) -cne $env:SOURCE_SHA) { throw 'Source mismatch' }
      - name: Build diagnostic runtime and renderer
        shell: pwsh
        env:
          RYGT_CODESIGN: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:RYGT_CI_ROOT
          python -m unittest discover -s ci/tests -p 'test_*.py' -v
          if ($LASTEXITCODE) { throw 'Python tests failed' }
          . ./ci/setup-hosted-windows.ps1
          & ./ci/build-windows.ps1 -Target Launcher -Flavor Diagnostics
          & ./ci/build-windows.ps1 -Target Renderer -Flavor Diagnostics
          & ./ci/build-windows.ps1 -Target Runtime
          & ./ci/build-windows.ps1 -Target Tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-windows-build
          path: |
            ${{ env.RYGT_CI_ROOT }}/artifacts/launcher-diagnostics/**
            ${{ env.RYGT_CI_ROOT }}/artifacts/renderer-diagnostics/**
            ${{ env.RYGT_CI_ROOT }}/artifacts/runtime/**
            ${{ env.RYGT_CI_ROOT }}/artifacts/tools/**
          if-no-files-found: error
          retention-days: 7
  package:
    needs: [tests, windows]
    runs-on: ubuntu-24.04
    env:
      CI_COMMIT_SHA: ${{ github.sha }}
      RENDERER_SHA: ${{ needs.tests.outputs.renderer }}
      CI_CHANNEL: debug-ci
      CI_PIPELINE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-windows-build
          path: artifacts/
      - name: Assemble and check ZIP
        run: python3 ci/package.py
      - name: Verify final fork provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          root = Path("dist")
          manifest = json.loads((root / "CI-PACKAGES.json").read_text())
          assert manifest["commit"] == os.environ["CI_COMMIT_SHA"]
          assert manifest["renderer_commit"] == os.environ["RENDERER_SHA"]
          assert len(manifest["variants"]) == 1
          item = manifest["variants"][0]
          archive = root / item["archive"]
          with archive.open("rb") as source:
              assert hashlib.file_digest(source, "sha256").hexdigest() == item["sha256"]
          with zipfile.ZipFile(archive) as z:
              info = json.loads(z.read(archive.stem + "/BUILD_INFO.txt"))
              assert info["renderer_source"].splitlines() == [
                  "https://github.com/gperea602/shadGT.git", os.environ["RENDERER_SHA"]]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GT7-experimental-diagnostics-${{ github.sha }}
          path: |
            dist/RyGT-debug-ci-*.zip
            dist/RyGT-debug-ci-*.zip.sha256
            dist/CI-PACKAGES.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GT7-discovery-tools-${{ github.sha }}
          path: |
            ci/diagnostics/gt7_shader_discovery.py
            ci/diagnostics/gt7_discovery_survey.py
            ci/diagnostics/gt7_preparation_preflight.py
            ci/diagnostics/GT7_SHADER_DISCOVERY.md
          if-no-files-found: error
          retention-days: 7
